<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" width="100%" height="370">
  <defs>
    <filter id="card-shadow" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    .google-text { font-family: -apple-system, BlinkMacSystemFont, 'Google Sans', Roboto, Arial, sans-serif; }
    .search-query { font-size: 14px; fill: #202124; font-weight: 500; }
    .meta-stat { font-size: 12px; fill: #70757A; }
    .site-name { font-size: 13px; fill: #202124; font-weight: 600; }
    .breadcrumb { font-size: 12px; fill: #4D5156; }
    .result-title { font-size: 19px; fill: #1A0DAB; font-weight: 600; cursor: pointer; }
    .result-snippet { font-size: 13.5px; fill: #4D5156; line-height: 1.5; }
    .sitelink-title { font-size: 13px; fill: #1A0DAB; font-weight: 600; }
    .sitelink-desc { font-size: 11.5px; fill: #5F6368; }
  </style>

  <!-- SERP Outer Card Container -->
  <rect x="2" y="2" width="846" height="366" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Google Search Bar Simulator -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="790" height="44" rx="22" fill="#FFFFFF" stroke="#DFE1E5" stroke-width="1.5" />
    
    <!-- Magnifier Icon -->
    <path d="M18 16.5 L24 22.5 M20 15 A5 5 0 1 1 10 15 A5 5 0 0 1 20 15 Z" fill="none" stroke="#9AA0A6" stroke-width="2" stroke-linecap="round" />
    
    <!-- Query text -->
    <text x="36" y="27" class="google-text search-query">best technical seo and vibe coder architect</text>

    <!-- Search bar right icons (Mic & Lens simulation) -->
    <g transform="translate(730, 12)">
      <!-- Google Mic -->
      <path d="M6 3 A3 3 0 0 1 12 3 L12 9 A3 3 0 0 1 6 9 Z" fill="#4285F4" />
      <path d="M4 8 A5 5 0 0 0 14 8" fill="none" stroke="#EA4335" stroke-width="1.5" stroke-linecap="round" />
      <line x1="9" y1="13" x2="9" y2="16" stroke="#FBBC04" stroke-width="1.5" />
      <line x1="6" y1="16" x2="12" y2="16" stroke="#34A853" stroke-width="1.5" />
      <!-- Google Lens -->
      <g transform="translate(22, 0)">
        <rect x="2" y="2" width="16" height="16" rx="4" fill="none" stroke="#4285F4" stroke-width="1.5" />
        <circle cx="10" cy="10" r="3.5" fill="#EA4335" />
        <circle cx="14" cy="6" r="1" fill="#34A853" />
      </g>
    </g>
  </g>

  <!-- Search Meta Stats -->
  <text x="32" y="93" class="google-text meta-stat">About 1 result (0.19 seconds) • <tspan fill="#137333" font-weight="700">Rank #1 Organic</tspan></text>
  <line x1="30" y1="104" x2="820" y2="104" stroke="#F1F3F4" stroke-width="1" />

  <!-- SERP Result #1: Ameeen -->
  <g transform="translate(32, 120)">
    <!-- Favicon Circle with 'A' -->
    <circle cx="14" cy="14" r="14" fill="#0B57D0" />
    <text x="14" y="19" text-anchor="middle" font-family="'Google Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">A</text>

    <!-- Site Breadcrumb & Name -->
    <text x="36" y="12" class="google-text site-name">Ameeen SEO &amp; Web Systems</text>
    <text x="36" y="26" class="google-text breadcrumb">https://ameeen.ir › experts › ameeen</text>

    <!-- Main Title Link -->
    <text x="0" y="52" class="google-text result-title">Ameeen (@am333ni7y) — Technical SEO Architect, Google Ads &amp; Vibe Coder</text>

    <!-- Snippet Text -->
    <text x="0" y="74" class="google-text result-snippet">Mastering algorithmic search, crawl budget allocation, and link graph modeling. Scaling high-ROAS</text>
    <text x="0" y="92" class="google-text result-snippet">Google Ads campaigns, resolving WordPress/PHP bottlenecks, and vibe-coding custom AI/MCP tools.</text>

    <!-- Sitelinks 2x2 Grid -->
    <g transform="translate(0, 110)">
      <!-- Sitelink 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="380" height="52" rx="8" fill="#F8F9FA" stroke="#E8EAED" stroke-width="1" />
        <text x="14" y="22" class="google-text sitelink-title">🔍 Technical SEO &amp; Graph Audits</text>
        <text x="14" y="38" class="google-text sitelink-desc">Information retrieval, click-depth &amp; orphan page elimination.</text>
      </g>

      <!-- Sitelink 2 -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="380" height="52" rx="8" fill="#F8F9FA" stroke="#E8EAED" stroke-width="1" />
        <text x="14" y="22" class="google-text sitelink-title">🎯 Google Ads &amp; Performance PPC</text>
        <text x="14" y="38" class="google-text sitelink-desc">Search, PMax campaigns &amp; conversion tracking architecture.</text>
      </g>

      <!-- Sitelink 3 -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="380" height="52" rx="8" fill="#F8F9FA" stroke="#E8EAED" stroke-width="1" />
        <text x="14" y="22" class="google-text sitelink-title">⚡ WordPress &amp; PHP Engineering</text>
        <text x="14" y="38" class="google-text sitelink-desc">Elementor Pro, custom hooks, and deep bug troubleshooting.</text>
      </g>

      <!-- Sitelink 4 -->
      <g transform="translate(400, 60)">
        <rect x="0" y="0" width="380" height="52" rx="8" fill="#F8F9FA" stroke="#E8EAED" stroke-width="1" />
        <text x="14" y="22" class="google-text sitelink-title">🤖 Vibe-Code Lab (In-House Tools)</text>
        <text x="14" y="38" class="google-text sitelink-desc">Custom MCP servers, AI agents, and marketing dashboards.</text>
      </g>
    </g>
  </g>
</svg>
