<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="430">
  <defs>
    <filter id="m3-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .font-main { font-family: -apple-system, BlinkMacSystemFont, 'Google Sans', Roboto, 'Segoe UI', Arial, sans-serif; }
    .sec-title { font-size: 13px; font-weight: 700; fill: #5F6368; letter-spacing: 1px; }
    .card-title { font-size: 14px; font-weight: 700; fill: #202124; }
    .card-desc { font-size: 11px; font-weight: 500; fill: #5F6368; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="846" height="426" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5" filter="url(#m3-shadow)" />

  <!-- Top Title -->
  <g transform="translate(30, 28)">
    <text x="0" y="0" class="font-main" font-size="18" font-weight="700" fill="#1A73E8">⚡ Tech Stack &amp; AI Automation Matrix</text>
    <text x="0" y="18" class="font-main" font-size="12" fill="#70757A">Specialized weaponry for search dominance, conversion engineering, and autonomous toolmaking.</text>
  </g>

  <!-- SECTION 1: Google & Search Engine Growth -->
  <g transform="translate(30, 75)">
    <text x="0" y="0" class="font-main sec-title">GOOGLE &amp; PERFORMANCE MARKETING</text>

    <!-- 1. Google Ads -->
    <g transform="translate(0, 10)">
      <rect width="250" height="60" rx="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1" />
      <circle cx="28" cy="30" r="16" fill="#FBBC04" fill-opacity="0.3" />
      <!-- Ads Icon simulation -->
      <path d="M22 36 L26 22 L34 36 Z" fill="#4285F4" />
      <circle cx="33" cy="33" r="3" fill="#34A853" />
      <text x="54" y="26" class="font-main card-title">Google Ads</text>
      <text x="54" y="42" class="font-main card-desc">High-ROAS Search &amp; PMax</text>
    </g>

    <!-- 2. Google Search Console -->
    <g transform="translate(270, 10)">
      <rect width="250" height="60" rx="10" fill="#E8F0FE" stroke="#4285F4" stroke-width="1" />
      <circle cx="28" cy="30" r="16" fill="#4285F4" fill-opacity="0.2" />
      <!-- GSC Icon simulation -->
      <path d="M20 34 L28 20 L36 34 Z" fill="none" stroke="#1A73E8" stroke-width="2" />
      <line x1="24" y1="30" x2="32" y2="30" stroke="#1A73E8" stroke-width="2" />
      <text x="54" y="26" class="font-main card-title">Search Console</text>
      <text x="54" y="42" class="font-main card-desc">Crawl &amp; Index Forensics</text>
    </g>

    <!-- 3. Google Analytics 4 -->
    <g transform="translate(540, 10)">
      <rect width="250" height="60" rx="10" fill="#FFF0E5" stroke="#FA7B17" stroke-width="1" />
      <circle cx="28" cy="30" r="16" fill="#FA7B17" fill-opacity="0.2" />
      <!-- GA4 Bar chart simulation -->
      <rect x="20" y="28" width="4" height="10" rx="1" fill="#FA7B17" />
      <rect x="26" y="24" width="4" height="14" rx="1" fill="#E37400" />
      <rect x="32" y="20" width="4" height="18" rx="1" fill="#E37400" />
      <text x="54" y="26" class="font-main card-title">Google Analytics 4</text>
      <text x="54" y="42" class="font-main card-desc">Funnel &amp; Event Attribution</text>
    </g>
  </g>

  <!-- SECTION 2: Web Engine & CMS -->
  <g transform="translate(30, 175)">
    <text x="0" y="0" class="font-main sec-title">WEB CORE &amp; CMS ENGINEERING</text>

    <!-- 4. WordPress -->
    <g transform="translate(0, 10)">
      <rect width="250" height="60" rx="10" fill="#E8F4F8" stroke="#21759B" stroke-width="1" />
      <circle cx="28" cy="30" r="16" fill="#21759B" />
      <text x="28" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF">W</text>
      <text x="54" y="26" class="font-main card-title">WordPress</text>
      <text x="54" y="42" class="font-main card-desc">Core Engineering &amp; WP-CLI</text>
    </g>

    <!-- 5. Elementor Pro -->
    <g transform="translate(270, 10)">
      <rect width="250" height="60" rx="10" fill="#FCE8EC" stroke="#92003B" stroke-width="1" />
      <circle cx="28" cy="30" r="16" fill="#92003B" />
      <text x="28" y="35" text-anchor="middle" class="font-main" font-size="14" font-weight="800" fill="#FFFFFF">E</text>
      <text x="54" y="26" class="font-main card-title">Elementor Pro</text>
      <text x="54" y="42" class="font-main card-desc">High-Conversion UI Systems</text>
    </g>

    <!-- 6. PHP -->
    <g transform="translate(540, 10)">
      <rect width="250" height="60" rx="10" fill="#EDE7F6" stroke="#673AB7" stroke-width="1" />
      <circle cx="28" cy="30" r="16" fill="#673AB7" fill-opacity="0.2" />
      <!-- PHP code symbol -->
      <text x="28" y="35" text-anchor="middle" class="font-main" font-size="12" font-weight="800" fill="#673AB7">&lt;?&gt;</text>
      <text x="54" y="26" class="font-main card-title">PHP</text>
      <text x="54" y="42" class="font-main card-desc">Custom Hooks, Filters &amp; DB</text>
    </g>
  </g>

  <!-- SECTION 3: AI & Automation Arsenal -->
  <g transform="translate(30, 275)">
    <text x="0" y="0" class="font-main sec-title">AI &amp; AGENTIC AUTOMATION ARSENAL</text>

    <!-- 7. Gemini -->
    <g transform="translate(0, 10)">
      <rect width="185" height="60" rx="10" fill="#E8F0FE" stroke="#4285F4" stroke-width="1" />
      <circle cx="24" cy="30" r="14" fill="#4285F4" fill-opacity="0.2" />
      <!-- Sparkle -->
      <path d="M24 20 L26 28 L34 30 L26 32 L24 40 L22 32 L14 30 L22 28 Z" fill="#1A73E8" />
      <text x="46" y="25" class="font-main card-title" font-size="13">Gemini</text>
      <text x="46" y="40" class="font-main card-desc">Multimodal &amp; IR</text>
    </g>

    <!-- 8. Claude -->
    <g transform="translate(200, 10)">
      <rect width="185" height="60" rx="10" fill="#FFF5EB" stroke="#D97706" stroke-width="1" />
      <circle cx="24" cy="30" r="14" fill="#D97706" fill-opacity="0.2" />
      <!-- Starburst -->
      <circle cx="24" cy="30" r="6" fill="#D97706" />
      <text x="46" y="25" class="font-main card-title" font-size="13">Claude</text>
      <text x="46" y="40" class="font-main card-desc">Agentic Logic</text>
    </g>

    <!-- 9. ChatGPT -->
    <g transform="translate(400, 10)">
      <rect width="185" height="60" rx="10" fill="#E6F4EA" stroke="#10B981" stroke-width="1" />
      <circle cx="24" cy="30" r="14" fill="#10B981" fill-opacity="0.2" />
      <!-- Swirl -->
      <circle cx="24" cy="30" r="6" fill="none" stroke="#10B981" stroke-width="2.5" />
      <text x="46" y="25" class="font-main card-title" font-size="13">ChatGPT</text>
      <text x="46" y="40" class="font-main card-desc">Prompt &amp; Concept</text>
    </g>

    <!-- 10. Antigravity -->
    <g transform="translate(600, 10)">
      <rect width="190" height="60" rx="10" fill="#E8F4FD" stroke="#0284C7" stroke-width="1" />
      <circle cx="24" cy="30" r="14" fill="#0284C7" fill-opacity="0.2" />
      <!-- Inverted gravity triangle -->
      <path d="M24 22 L31 35 L17 35 Z" fill="#0284C7" />
      <text x="46" y="25" class="font-main card-title" font-size="13">Antigravity</text>
      <text x="46" y="40" class="font-main card-desc">Autonomous Agent</text>
    </g>
  </g>
</svg>
